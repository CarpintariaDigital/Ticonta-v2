[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --cov=app --cov-report=term-missing --cov-report=html:htmlcov -v
markers =
    unit: Unit tests
    integration: Integration and multi-module tests
    slow: Slow running tests
    compliance: Mozambique fiscal & accounting compliance tests
    auth: Authentication and authorization tests
