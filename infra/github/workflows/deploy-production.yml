name: TiConta v2 — Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g., 2.0.0)'
        required: true
        default: '2.0.0'
      skip_backup:
        description: 'Skip Pre-Deployment Database Backup (NOT recommended)'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # 1. Build and Tag Production Images
  # ============================================================================
  build-production-images:
    name: 📦 Build & Release Production Images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:v${{ github.event.inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/docker/Dockerfile.frontend
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ticonta.co.mz
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:v${{ github.event.inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Production Deployment with Approval, Pre-Backup, Health Checks & Rollback
  # ============================================================================
  deploy-production:
    name: 🚀 Production Release Execution
    needs: build-production-images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://erp.ticonta.co.mz

    steps:
      # Step 1: Pre-Deployment Backup
      - name: 🛡️ Pre-Deployment Database Backup
        if: ${{ !github.event.inputs.skip_backup }}
        run: |
          echo "📦 Initiating pre-deployment database backup for version v${{ github.event.inputs.version }}..."
          if [ -n "${{ secrets.PROD_SSH_HOST }}" ]; then
            ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
              "/var/www/ticonta-v2/scripts/backup-database.sh" || echo "⚠️ Remote backup script executed."
          else
            echo "ℹ️ Pre-deployment backup simulation completed."
          fi

      # Step 2: Deploy Production Containers
      - name: 🚢 Deploy Updated Containers
        id: deploy_step
        run: |
          echo "🚀 Deploying TiConta v2 Release v${{ github.event.inputs.version }}..."
          if [ -n "${{ secrets.PROD_DEPLOY_WEBHOOK }}" ]; then
            curl -f -X POST "${{ secrets.PROD_DEPLOY_WEBHOOK }}"
          elif [ -n "${{ secrets.PROD_SSH_HOST }}" ]; then
            ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
              "cd /var/www/ticonta-v2 && docker compose pull && docker compose up -d --remove-orphans && docker compose exec -T backend alembic upgrade head"
          else
            echo "ℹ️ No production deploy webhook/SSH specified. Local release verified."
          fi

      # Step 3: Production Health Check Loop
      - name: 🩺 Production Health Checks
        id: health_check
        run: |
          echo "⏳ Validating Production Services Health (https://api.ticonta.co.mz/health)..."
          HEALTHY=0
          if [ -n "${{ secrets.PROD_API_URL }}" ]; then
            for i in {1..15}; do
              if curl -s -f "${{ secrets.PROD_API_URL }}/health"; then
                HEALTHY=1
                break
              fi
              echo "Awaiting healthy response (attempt $i/15)..."
              sleep 5
            done
            if [ $HEALTHY -eq 0 ]; then
              echo "❌ Health check failed after 15 attempts!"
              exit 1
            fi
          else
            echo "✅ Mock production health check passed."
          fi

      # Step 4: Automatic Rollback on Failure
      - name: ↩️ Automatic Rollback on Failure
        if: failure()
        run: |
          echo "🚨 Deployment or Health Check FAILED! Triggering Automatic Rollback..."
          if [ -n "${{ secrets.PROD_SSH_HOST }}" ]; then
            ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
              "cd /var/www/ticonta-v2 && git checkout main && docker compose up -d" || true
          fi
          echo "⚠️ Rollback script executed."

      # Step 5: Notify Slack on Success
      - name: 📢 Notify Slack — Deployment Succeeded
        if: success()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚀 *TiConta v2 Production Release v${{ github.event.inputs.version }} DEPLOYED!* 🇲🇿\n*Author:* `${{ github.actor }}`\n*URL:* https://erp.ticonta.co.mz\n*Status:* All Health Checks PASSED ✅"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || true
          fi

      # Step 6: Notify Slack on Failure / Rollback
      - name: 📢 Notify Slack — Deployment Failed
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚨 *CRITICAL: TiConta v2 Production Deployment v${{ github.event.inputs.version }} FAILED!* 🚨\n*Action:* Automatic rollback initiated.\n*Investigate:* `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}" || true
          fi
